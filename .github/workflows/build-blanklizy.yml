name: Build Blanklizy Shortcut

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'blanklizy/Blanklizy.cherri'
      - '.github/workflows/build-blanklizy.yml'

permissions:
  contents: write

concurrency:
  group: build-blanklizy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build the Cherri compiler
        run: |
          git clone --depth 1 https://github.com/electrikmilk/cherri.git /tmp/cherri-src
          cd /tmp/cherri-src
          go build -o /tmp/cherri .

      - name: Compile and sign the shortcut
        run: |
          cd blanklizy
          /tmp/cherri Blanklizy.cherri --share=anyone
          ls -la

      - name: Verify the shortcut was actually signed
        run: |
          cd blanklizy
          file Blanklizy.shortcut
          head -c 4 Blanklizy.shortcut | grep -q "AEA1" && echo "Signed OK" || (echo "NOT SIGNED" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: Blanklizy-signed-shortcut
          path: blanklizy/Blanklizy.shortcut

      - name: Commit the signed shortcut back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blanklizy/Blanklizy.shortcut
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sign Blanklizy.shortcut via CI (macos-14 runner)"
            for i in 1 2 3 4 5; do
              git push origin HEAD:${{ github.ref_name }} && break
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              sleep 5
            done
          fi
